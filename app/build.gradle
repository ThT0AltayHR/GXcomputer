plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gxcomputer.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gxcomputer.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Cihazın büyük çoğunluğu bu mimaride; box64 zaten sadece ARM64 hedefliyor
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false // Wine/Box64 sürecini yöneten reflection-ağır kodda obfuscation riskli; kararlılık öncelikli
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true // box64 native yürütülebilirinin çalışabilmesi için gerekli (bkz. ComponentInstaller yorumları)
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06' // şifrenin şifreli saklanması için
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // .tzst (Zstandard + tar) bileşen paketlerini açmak için
    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    // GE-Proton .wcp paketinin içindeki prefixPack.txz (XZ + tar) için
    implementation 'org.tukaani:xz:1.9'

    // Canlı hava durumu / haber servisleri için (bkz. README - kendi API anahtarınızı eklemeniz gerekir)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
